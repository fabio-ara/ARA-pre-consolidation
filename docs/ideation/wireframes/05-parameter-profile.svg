<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Perfil e parâmetros</title><desc id="d">Wireframe móvel com perfil-base, overlays, consequências e parâmetros avançados.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:14px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="48" class="body">‹ Curso</text><text x="28" y="82" class="title">Como o curso deve funcionar?</text><text x="28" y="105" class="small">Escolha um perfil e ajuste somente o necessário.</text><text x="28" y="143" class="label">Contexto</text><rect x="28" y="156" width="334" height="44" rx="10" class="soft"/><text x="44" y="183" class="body">Estudo autodirigido</text><text x="336" y="183" class="body">⌄</text><text x="28" y="229" class="label">Perfil-base</text><rect x="28" y="242" width="334" height="84" rx="12" class="box"/><circle cx="49" cy="271" r="9" fill="#111"/><circle cx="49" cy="271" r="4" fill="#fff"/><text x="69" y="268" class="label">AraLearn reference</text><text x="69" y="290" class="small">ritmo livre · estado mínimo · revisão manual</text><text x="69" y="309" class="small">feedback local · sem ranking ou streak</text><text x="28" y="358" class="label">Overlays</text><rect x="28" y="371" width="334" height="52" rx="10" class="box"/><rect x="43" y="387" width="20" height="20" rx="4" fill="#111"/><text x="49" y="402" fill="#fff" class="small">✓</text><text x="76" y="403" class="body">Acessibilidade padrão</text><text x="318" y="403" class="small">obrigatório</text><rect x="28" y="433" width="334" height="52" rx="10" class="box"/><rect x="43" y="449" width="20" height="20" rx="4" fill="#fff" stroke="#111"/><text x="76" y="465" class="body">Uso offline prioritário</text><rect x="28" y="505" width="334" height="115" rx="12" class="soft"/><text x="44" y="532" class="label">Consequências deste perfil</text><text x="44" y="556" class="small">• tentativas não são contadas</text><text x="44" y="578" class="small">• estudante controla o ritmo</text><text x="44" y="600" class="small">• conteúdo não será reescrito</text><text x="28" y="651" class="label">Ajustes</text><rect x="28" y="664" width="334" height="48" rx="10" class="box"/><text x="44" y="693" class="body">2 overrides ativos</text><text x="316" y="693" class="body">Ver ›</text><rect x="28" y="724" width="160" height="44" rx="10" class="box"/><text x="55" y="752" class="body">Comparar perfis</text><rect x="202" y="724" width="160" height="44" rx="10" class="button"/><text x="247" y="752" class="buttonText">Aplicar</text><text x="28" y="801" class="small">Mudanças de conteúdo exigirão nova revisão.</text></svg>