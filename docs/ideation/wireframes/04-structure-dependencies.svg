ss="line"/><text x="600" y="333" class="small">introduces</text><path d="M805 381 L865 381" class="line" stroke-dasharray="5 4"/><text x="811" y="367" class="small">requires</text><rect x="435" y="474" width="585" height="150" rx="10" class="soft"/><text x="453" y="501" class="label">Placement selecionado: Elasticidade</text><text x="453" y="526" class="body">Origem: referência · usada também em 2 outros cursos</text><text x="453" y="549" class="body">Nova revisão disponível: r3 · não aplicada automaticamente</text><rect x="453" y="568" width="120" height="38" rx="8" class="button"/><text x="480" y="592" class="buttonText">Ver diff</text><rect x="583" y="568" width="145" height="38" rx="8" class="box"/><text x="604" y="592" class="body">Manter r2</text><rect x="738" y="568" width="150" height="38" rx="8" class="box"/><text x="758" y="592" class="body">Atualizar referência</text></svg>