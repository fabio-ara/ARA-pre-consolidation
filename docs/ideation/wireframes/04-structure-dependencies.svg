<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Composição e dependências</title><desc id="d">Wireframe desktop com estrutura do curso, placements e grafo/lista de dependências.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:22px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f4f4f4;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}.line{stroke:#555;stroke-width:1.5;fill:none}</style><rect width="1100" height="720" fill="#fff"/><rect x="14" y="14" width="1072" height="692" rx="18" class="box"/><text x="36" y="54" class="title">Composição do curso</text><text x="36" y="80" class="small">Versão 7 · 12 placements · 18 relações</text><rect x="850" y="34" width="106" height="36" rx="9" class="box"/><text x="877" y="57" class="body">Lista</text><rect x="966" y="34" width="92" height="36" rx="9" class="button"/><text x="989" y="57" class="buttonText">Grafo</text><rect x="30" y="105" width="330" height="565" rx="12" class="soft"/><text x="48" y="136" class="label">Estrutura</text><rect x="46" y="153" width="298" height="55" rx="8" class="box"/><text x="62" y="178" class="label">Módulo 1 · Conceitos</text><text x="62" y="197" class="small">4 placements</text><rect x="64" y="221" width="264" height="50" rx="8" class="box"/><text x="80" y="243" class="body">1. Fundamentos</text><text x="80" y="260" class="small">ref ms-012 rev.4 · auditada</text><rect x="64" y="281" width="264" height="50" rx="8" class="box"/><text x="80" y="303" class="body">2. Elasticidade</text><text x="80" y="320" class="small">ref ms-031 rev.2 · update disponível</text><rect x="64" y="341" width="264" height="50" rx="8" class="box"/><text x="80" y="363" class="body">3. Disponibilidade</text><text x="80" y="380" class="small">fork ms-044 rev.1</text><rect x