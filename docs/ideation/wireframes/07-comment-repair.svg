<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Comentários e reparo</title><desc id="d">Wireframe móvel de finding situado, resposta e autorização de reparo.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="48" class="body">‹ Revisar</text><text x="28" y="83" class="title">Finding #18</text><rect x="278" y="61" width="80" height="27" rx="13" class="soft"/><text x="298" y="79" class="small">aberto</text><text x="28" y="119" class="small">Alta disponibilidade · revisão 3 · card 2</text><rect x="28" y="139" width="334" height="86" rx="12" class="soft"/><text x="44" y="166" class="label">Possível lacuna de pré-requisito</text><text x="44" y="190" class="body">O card usa “zona de disponibilidade”</text><text x="44" y="210" class="body">antes de o conceito ser introduzido.</text><text x="28" y="259" class="label">Alvo</text><rect x="28" y="272" width="334" height="58" rx="10" class="box"/><text x="44" y="298" class="body">Card 2 · parágrafo principal</text><text x="44" y="318" class="small">placement no curso Dataprev · posição 14</text><text x="28" y="366" class="label">Discussão</text><rect x="28" y="379" width="334" height="75" rx="10" class="box"/><text x="44" y="405" class="small">Auditor GPT · há 8 min</text><text x="44" y="430" class="body">Sugestão: introduzir conceito ou adicionar</text><text x="44" y="449" class="body">dependência explícita.</text><rect x="28" y="466" width="334" height="75" rx="10" class="soft"/><text x="44" y="492" class="small">Fabio · agora</text><text x="44" y="517" class="body">Prefiro adicionar uma microssequência curta</text><text x="44" y="536" class="body">antes desta unidade.</text><rect x="28" y="570" width="334" height="78" rx="10" class="box"/><text x="44" y="596" class="label">Escopo do reparo</text><text x="44" y="620" class="small">Criar 1 microssequência e atualizar 1 relação.</text><text x="44" y="640" class="small">Nenhum card existente poderá ser reescrito.</text><rect x="28" y="672" width="160" height="45" rx="10" class="box"/><text x="58" y="700" class="body">Pedir informação</text><rect x="202" y="672" width="160" height="45" rx="10" class="button"/><text x="230" y="700" class="buttonText">Autorizar reparo</text><rect x="28" y="729" width="160" height="42" rx="10" class="box"/><text x="56" y="756" class="body">Rejeitar finding</text><rect x="202" y="729" width="160" height="42" rx="10" class="box"/><text x="244" y="756" class="body">Responder</text><text x="28" y="803" class="small">Responder não encerra o finding.</text></svg>