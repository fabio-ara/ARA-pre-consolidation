<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="t d"><title id="t">Protocolo e condições de pesquisa</title><desc id="d">Wireframe desktop com pergunta, condições, invariantes, instrumentos, eventos e direitos.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:22px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}</style><rect width="1120" height="720" fill="#fff"/><rect x="14" y="14" width="1092" height="692" rx="18" class="box"/><text x="34" y="54" class="title">Protocolo: concentração da informação</text><text x="34" y="80" class="small">rascunho · versão 2 · nenhuma coleta iniciada</text><rect x="918" y="34" width="168" height="38" rx="9" class="box"/><text x="946" y="58" class="body">Validar protocolo</text><rect x="30" y="105" width="275" height="565" rx="12" class="soft"/><text x="50" y="138" class="label">Seções</text><rect x="44" y="156" width="247" height="40" rx="8" class="box"/><text x="60" y="181" class="label">1. Pergunta e finalidade</text><text x="60" y="225" class="body">2. Condições</text><text x="60" y="265" class="body">3. Participantes e assignment</text><text x="60" y="305" class="body">4. Instrumentos</text><text x="60" y="345" class="body">5. Eventos autorizados</text><text x="60" y="385" class="body">6. Medidas e análise</text><text x="60" y="425" class="body">7. Direitos e retenção</text><text x="60" y="465" class="body">8. Snapshots e provenance</text><text x="50" y="520" class="label">Estado</text><text x="60" y="548" class="body">✓ 6 seções completas</text><text x="60" y="574" class="body">! 2 decisões pendentes</text><text x="60" y="600" class="small">Sem instrumento tardio definido</text><text x="60" y="621" class="small">Retenção precisa de revisão</text><rect x="325" y="105" width="510" height="565" rx="12" class="box"/><text x="350" y="140" class="label">Pergunta de pesquisa</text><rect x="350" y="155" width="460" height="70" rx="9" class="soft"/><text x="366" y="182" class="body">Como a concentração da informação altera</text><text x="366" y="204" class="body">retenção e carga percebida no mesmo conteúdo?</text><text x="350" y="263" class="label">Condições</text><rect x="350" y="278" width="218" height="130" rx="10" class="box"/><text x="366" y="306" class="label">A · segmentada</text><text x="366" y="330" class="small">course variant 12A</text><text x="366" y="352" class="small">profile: research locked</text><text x="366" y="374" class="small">12 microssequências</text><rect x="592" y="278" width="218" height="130" rx="10" class="box"/><text x="608" y="306" class="label">B · concentrada</text><text x="608" y="330" class="small">course variant 12B</text><text x="608" y="352" class="small">profile: research locked</text><text x="608" y="374" class="small">7 microssequências</text><text x="350" y="445" class="label">Invariantes declaradas</text><text x="366" y="473" class="body">✓ conceitos e outcomes</text><text x="366" y="497" class="body">✓ fontes e práticas avaliativas</text><text x="366" y="521" class="body">! dificuldade linguística em auditoria</text><text x="350" y="562" class="label">Evidência autorizada</text><text x="366" y="590" class="small">pré/pós-teste · escala de carga · entrevista</text><text x="366" y="613" class="small">eventos: completion + response confirmed</text><rect x="855" y="105" width="235" height="565" rx="12" class="soft"/><text x="878" y="140" class="label">Resumo de governança</text><text x="878" y="174" class="body">Participantes: 40</text><text x="878" y="199" class="body">Assignment: randomizado</text><text x="878" y="224" class="body">Identidade: pseudônima</text><text x="878" y="249" class="body">Retirada: permitida</text><line x1="878" y1="270" x2="1067" y2="270" stroke="#aaa"/><text x="878" y="304" class="label">Não coletado</text><text x="878" y="332" class="small">tempo por card</text><text x="878" y="354" class="small">aberturas de tela</text><text x="878" y="376" class="small">número de tentativas</text><text x="878" y="398" class="small">logs operacionais</text><line x1="878" y1="425" x2="1067" y2="425" stroke="#aaa"/><text x="878" y="460" class="label">Comparabilidade</text><text x="878" y="488" class="small">2 diferenças intencionais</text><text x="878" y="510" class="small">1 diferença acidental aberta</text><rect x="878" y="545" width="189" height="38" rx="8" class="button"/><text x="912" y="569" class="buttonText">Abrir diff completo</text><rect x="878" y="595" width="189" height="38" rx="8" class="box"/><text x="916" y="619" class="body">Exportar rascunho</text></svg>