<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="t d"><title id="t">Administração de armazenamento</title><desc id="d">Wireframe desktop que traduz storage em categorias, impacto e ações compreensíveis.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:22px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}</style><rect width="1120" height="720" fill="#fff"/><rect x="14" y="14" width="1092" height="692" rx="18" class="box"/><text x="34" y="54" class="title">Armazenamento e impacto</text><text x="34" y="80" class="small">Visão compreensível · detalhes técnicos opcionais</text><rect x="876" y="34" width="210" height="38" rx="9" class="box"/><text x="918" y="58" class="body">Abrir diagnóstico técnico</text><rect x="30" y="105" width="310" height="565" rx="12" class="soft"/><text x="52" y="138" class="label">Resumo desta implantação</text><text x="52" y="174" class="body">Banco: 312 MB de 500 MB</text><rect x="52" y="189" width="250" height="9" rx="4" fill="#ccc"/><rect x="52" y="189" width="156" height="9" fill="#111"/><text x="52" y="230" class="body">Arquivos: 641 MB de 1 GB</text><rect x="52" y="245" width="250" height="9" rx="4" fill="#ccc"/><rect x="52" y="245" width="160" height="9" fill="#111"/><text x="52" y="286" class="body">Neste dispositivo: 94 MB</text><rect x="52" y="301" width="250" height="9" rx="4" fill="#ccc"/><rect x="52" y="301" width="67" height="9" fill="#111"/><rect x="48" y="337" width="274" height="84" rx="10" class="box"/><text x="64" y="364" class="label">Atenção sem bloqueio</text><text x="64" y="388" class="small">18 previews antigos podem ser limpos.</text><text x="64" y="408" class="small">Nenhum curso publicado será afetado.</text><text x="52" y="460" class="label">Filtrar por</text><text x="62" y="490" class="body">● Tipo de dado</text><text x="62" y="520" class="body">○ Workspace</text><text x="62" y="550" class="body">○ Curso</text><text x="62" y="580" class="body">○ Package</text><text x="62" y="610" class="body">○ Sem referência</text><rect x="360" y="105" width="730" height="565" rx="12" class="box"/><text x="382" y="138" class="label">Uso por categoria</text><rect x="382" y="157" width="686" height="58" rx="9" class="box"/><text x="398" y="183" class="body">Artefatos publicados</text><text x="745" y="183" class="small">248 MB · retenção obrigatória</text><text x="1036" y="183" class="body">›</text><rect x="382" y="227" width="686" height="72" rx="9" class="soft"/><text x="398" y="253" class="body">Previews privados antigos</text><text x="745" y="253" class="small">132 MB · 18 itens</text><text x="398" y="278" class="small">Pode remover sem alterar workspaces ou publicações.</text><rect x="382" y="311" width="686" height="58" rx="9" class="box"/><text x="398" y="337" class="body">Assets reutilizados</text><text x="745" y="337" class="small">201 MB · usados por 11 cursos</text><text x="1036" y="337" class="body">›</text><rect x="382" y="381" width="686" height="58" rx="9" class="box"/><text x="398" y="407" class="body">Microssequências sem placement</text><text x="745" y="407" class="small">34 MB · 7 candidatas a arquivo</text><text x="1036" y="407" class="body">›</text><rect x="382" y="451" width="686" height="58" rx="9" class="box"/><text x="398" y="477" class="body">Dados de pesquisa</text><text x="745" y="477" class="small">26 MB · retenção até 2028</text><text x="1036" y="477" class="body">›</text><text x="382" y="548" class="label">Ação selecionada: previews antigos</text><text x="382" y="575" class="body">Libera aproximadamente 132 MB.</text><text x="382" y="598" class="small">Não remove cursos, microssequências, comentários ou versões publicadas.</text><rect x="382" y="618" width="150" height="37" rx="8" class="box"/><text x="413" y="642" class="body">Exportar lista</text><rect x="918" y="618" width="150" height="37" rx="8" class="button"/><text x="952" y="642" class="buttonText">Limpar previews</text></svg>