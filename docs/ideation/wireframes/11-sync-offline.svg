<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Offline e sincronização</title><desc id="d">Wireframe móvel com estado local, pendências, conflito e materialização.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="48" class="body">‹ Mais</text><text x="28" y="83" class="title">Neste dispositivo</text><rect x="272" y="61" width="86" height="27" rx="13" class="soft"/><text x="292" y="79" class="small">offline</text><rect x="28" y="117" width="334" height="85" rx="12" class="soft"/><text x="44" y="144" class="label">Você pode continuar trabalhando</text><text x="44" y="168" class="body">2 alterações serão sincronizadas quando</text><text x="44" y="188" class="body">a conexão voltar.</text><text x="28" y="239" class="label">Pendências</text><rect x="28" y="252" width="334" height="78" rx="10" class="box"/><text x="44" y="279" class="body">Observação no card 14</text><text x="44" y="302" class="small">salva localmente · pronta para enviar</text><text x="331" y="292" class="body">›</text><rect x="28" y="342" width="334" height="100" rx="10" class="box"/><text x="44" y="369" class="body">Revisão local da ms-044</text><text x="44" y="392" class="small">base r3 · operação aguardando conexão</text><rect x="44" y="405" width="103" height="27" rx="7" class="soft"/><text x="66" y="423" class="small">Exportar cópia</text><text x="28" y="480" class="label">Atenção</text><rect x="28" y="493" width="334" height="116" rx="10" fill="#fff" stroke="#111" stroke-dasharray="5 4"/><text x="44" y="520" class="label">Conflito preservado</text><text x="44" y="544" class="body">Outra revisão da mesma unidade foi criada.</text><text x="44" y="566" class="small">Nada foi sobrescrito automaticamente.</text><rect x="44" y="575" width="130" height="26" rx="7" class="button"/><text x="65" y="593" class="buttonText">Resolver depois</text><text x="28" y="647" class="label">Cursos offline</text><text x="28" y="673" class="body">3 cursos · 94 MB</text><rect x="28" y="691" width="334" height="47" rx="10" class="box"/><text x="44" y="720" class="body">Gerenciar downloads e packages</text><text x="338" y="720" class="body">›</text><rect x="28" y="756" width="160" height="43" rx="10" class="box"/><text x="60" y="783" class="body">Tentar sincronizar</text><rect x="202" y="756" width="160" height="43" rx="10" class="box"/><text x="241" y="783" class="body">Diagnóstico</text></svg>