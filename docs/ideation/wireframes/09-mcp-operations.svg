<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Operações GPT e MCP</title><desc id="d">Wireframe móvel mostrando fila, execução, pedido de informação, preview e falha recuperável.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="48" class="body">‹ Workspace</text><text x="28" y="83" class="title">Operações GPT/MCP</text><text x="28" y="107" class="small">O trabalho continua registrado mesmo sem o chat aberto.</text><rect x="28" y="133" width="334" height="108" rx="12" class="soft"/><text x="44" y="159" class="label">Reauditar parte 4</text><text x="44" y="183" class="body">Executando · 6 de 9 microssequências</text><rect x="44" y="199" width="230" height="7" rx="3" fill="#ccc"/><rect x="44" y="199" width="154" height="7" fill="#111"/><rect x="285" y="184" width="61" height="36" rx="8" class="box"/><text x="299" y="207" class="small">Abrir</text><rect x="28" y="255" width="334" height="126" rx="12" class="box"/><text x="44" y="282" class="label">Reparo da ms-044</text><text x="44" y="306" class="body">Preview pronto · aguardando decisão</text><text x="44" y="329" class="small">Escopo: 1 card e 1 dependência</text><rect x="44" y="342" width="132" height="30" rx="7" class="button"/><text x="67" y="362" class="buttonText">Revisar preview</text><rect x="188" y="342" width="92" height="30" rx="7" class="box"/><text x="210" y="362" class="small">Rejeitar</text><rect x="28" y="395" width="334" height="126" rx="12" class="box"/><text x="44" y="422" class="label">Planejar módulo 3</text><text x="44" y="446" class="body">Precisa de informação</text><text x="44" y="469" class="small">Escolha: incluir VMware NSX neste módulo?</text><rect x="44" y="482" width="154" height="30" rx="7" class="button"/><text x="64" y="502" class="buttonText">Responder ao pedido</text><rect x="28" y="535" width="334" height="128" rx="12" class="box"/><text x="44" y="562" class="label">Criar microssequência</text><text x="44" y="586" class="body">Falhou sem alterar o workspace</text><text x="44" y="609" class="small">Provider indisponível · request id preservado</text><rect x="44" y="622" width="105" height="30" rx="7" class="box"/><text x="68" y="642" class="small">Tentar de novo</text><rect x="160" y="622" width="95" height="30" rx="7" class="box"/><text x="184" y="642" class="small">Detalhes</text><text x="28" y="700" class="label">Nova operação</text><rect x="28" y="713" width="334" height="48" rx="10" class="button"/><text x="107" y="743" class="buttonText">Abrir conversa com contexto</text><text x="28" y="795" class="small">Nenhuma operação pode aprovar ou publicar sua própria saída.</text></svg>