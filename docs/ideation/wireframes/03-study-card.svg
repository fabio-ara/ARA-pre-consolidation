<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Card de estudo</title><desc id="d">Wireframe móvel de prática com opções, feedback, observação e navegação.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:14px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="47" class="body">× Fechar</text><text x="252" y="47" class="small">Card 3 de 7 · offline</text><rect x="28" y="66" width="334" height="5" rx="2" fill="#ddd"/><rect x="28" y="66" width="143" height="5" fill="#111"/><text x="28" y="104" class="small">Alta disponibilidade · prática</text><text x="28" y="136" class="title">Qual situação representa</text><text x="28" y="159" class="title">elasticidade na nuvem?</text><text x="28" y="194" class="body">Selecione a alternativa mais adequada.</text><rect x="28" y="224" width="334" height="62" rx="12" class="box"/><circle cx="48" cy="255" r="9" fill="#fff" stroke="#111"/><text x="68" y="252" class="body">Aumentar recursos antes da demanda</text><text x="68" y="271" class="small">e mantê-los permanentemente.</text><rect x="28" y="298" width="334" height="62" rx="12" class="soft"/><circle cx="48" cy="329" r="9" fill="#111"/><circle cx="48" cy="329" r="4" fill="#fff"/><text x="68" y="326" class="body">Adicionar e remover recursos</text><text x="68" y="345" class="small">conforme a demanda varia.</text><rect x="28" y="372" width="334" height="62" rx="12" class="box"/><circle cx="48" cy="403" r="9" fill="#fff" stroke="#111"/><text x="68" y="400" class="body">Manter duas cópias idênticas</text><text x="68" y="419" class="small">em regiões diferentes.</text><rect x="28" y="454" width="210" height="46" rx="11" class="button"/><text x="103" y="483" class="buttonText">Confirmar</text><rect x="250" y="454" width="112" height="46" rx="11" class="box"/><text x="286" y="483" class="body">Limpar</text><rect x="28" y="521" width="334" height="91" rx="12" class="soft"/><text x="44" y="548" class="label">Feedback aparece após confirmar</text><text x="44" y="571" class="small">A configuração atual permite tentar novamente</text><text x="44" y="590" class="small">sem registrar número de tentativas.</text><rect x="28" y="635" width="104" height="39" rx="10" class="box"/><text x="47" y="660" class="small">☆ Rever</text><rect x="143" y="635" width="104" height="39" rx="10" class="box"/><text x="164" y="660" class="small">◇ Observar</text><rect x="258" y="635" width="104" height="39" rx="10" class="box"/><text x="283" y="660" class="small">✎ Editar</text><line x1="28" y1="720" x2="362" y2="720" stroke="#bbb"/><text x="34" y="755" class="body">‹ Anterior</text><text x="276" y="755" class="label">Próximo ›</text><text x="28" y="793" class="small">Resource: choice · Practice: single selection</text></svg>