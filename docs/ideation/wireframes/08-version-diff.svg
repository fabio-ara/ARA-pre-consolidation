<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="t d"><title id="t">Comparação de versões</title><desc id="d">Wireframe desktop de diff semântico com filtros de conteúdo, composição e parâmetros.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:22px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:13px;font-weight:700}.add{fill:#eaeaea;stroke:#111}.remove{fill:#fff;stroke:#111;stroke-dasharray:5 4}</style><rect width="1120" height="720" fill="#fff"/><rect x="14" y="14" width="1092" height="692" rx="18" class="box"/><text x="34" y="54" class="title">Comparar revisões</text><text x="34" y="80" class="small">Microssequência “Alta disponibilidade” · r3 → r4</text><rect x="760" y="34" width="100" height="36" rx="8" class="button"/><text x="783" y="57" class="buttonText">Conteúdo</text><rect x="870" y="34" width="105" height="36" rx="8" class="box"/><text x="892" y="57" class="body">Estrutura</text><rect x="985" y="34" width="100" height="36" rx="8" class="box"/><text x="1002" y="57" class="body">Parâmetros</text><rect x="30" y="105" width="520" height="500" rx="12" class="box"/><text x="52" y="136" class="label">Revisão 3 · atual</text><text x="52" y="161" class="small">publicada em 01/08 · usada em 3 cursos</text><rect x="50" y="185" width="480" height="104" rx="10" class="remove"/><text x="66" y="212" class="small">Card 2 · parágrafo principal</text><text x="66" y="240" class="body">Uma zona de disponibilidade mantém</text><text x="66" y="262" class="body">recursos independentes dentro da região.</text><rect x="50" y="310" width="480" height="82" rx="10" class="box"/><text x="66" y="337" class="small">Relação</text><text x="66" y="365" class="body">Fundamentos → Disponibilidade: introduces</text><rect x="50" y="413" width="480" height="132" rx="10" class="soft"/><text x="66" y="441" class="label">Resumo</text><text x="66" y="468" class="body">4 cards · 2 fontes · 1 dependência</text><text x="66" y="492" class="body">Perfil e practices não mudaram.</text><text x="66" y="520" class="small">Finding #18 permanece aberto.</text><rect x="570" y="105" width="520" height="500" rx="12" class="box"/><text x="592" y="136" class="label">Revisão 4 · proposta</text><text x="592" y="161" class="small">gerada por repairer · ainda não aplicada</text><rect x="590" y="185" width="480" height="104" rx="10" class="add"/><text x="606" y="212" class="small">Card 2 · parágrafo principal · alterado</text><text x="606" y="240" class="body">Uma zona de disponibilidade é um conjunto</text><text x="606" y="262" class="body">isolado de recursos dentro de uma região.</text><rect x="590" y="310" width="480" height="82" rx="10" class="add"/><text x="606" y="337" class="small">Nova relação</text><text x="606" y="365" class="body">Regiões e zonas → Disponibilidade: requires</text><rect x="590" y="413" width="480" height="132" rx="10" class="soft"/><text x="606" y="441" class="label">Resumo</text><text x="606" y="468" class="body">4 cards · 2 fontes · 2 dependências</text><text x="606" y="492" class="body">Nenhuma mudança de configuração.</text><text x="606" y="520" class="small">Auditoria: finding resolvido; sem regressões.</text><rect x="30" y="626" width="170" height="46" rx="10" class="box"/><text x="68" y="655" class="body">Rejeitar proposta</text><rect x="215" y="626" width="185" height="46" rx="10" class="box"/><text x="247" y="655" class="body">Aplicar parcialmente</text><rect x="885" y="626" width="205" height="46" rx="10" class="button"/><text x="934" y="655" class="buttonText">Criar revisão 4</text><text x="430" y="653" class="small">A r3 não será alterada nem apagada.</text></svg>