<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Visão de curso</title><desc id="d">Wireframe móvel com objetivo, versão, offline, estrutura, parâmetros e ações.</desc><style>text{font-family:Arial,sans-serif;fill:#111}.small{font-size:12px}.body{font-size:14px}.title{font-size:20px;font-weight:700}.label{font-size:13px;font-weight:700}.box{fill:#fff;stroke:#111;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#888}.button{fill:#111}.buttonText{fill:#fff;font-size:14px;font-weight:700}</style><rect width="390" height="844" fill="#fff"/><rect x="12" y="12" width="366" height="820" rx="24" class="box"/><text x="28" y="49" class="body">‹ Biblioteca</text><text x="28" y="86" class="title">Computação em Nuvem</text><text x="28" y="110" class="small">Curso privado · versão 7</text><rect x="270" y="92" width="88" height="25" rx="12" class="soft"/><text x="285" y="109" class="small">offline pronto</text><text x="28" y="146" class="label">Objetivo</text><text x="28" y="170" class="body">Preparar para conceitos, serviços, arquitetura</text><text x="28" y="191" class="body">e ferramentas de nuvem e virtualização.</text><rect x="28" y="215" width="334" height="84" rx="12" class="soft"/><text x="44" y="241" class="label">Estado neste dispositivo</text><text x="44" y="264" class="small">31 MB · 12 microssequências · 6 packages</text><text x="44" y="284" class="small">sincronizado há 4 min · sem pendências</text><rect x="28" y="318" width="214" height="46" rx="11" class="button"/><text x="93" y="347" class="buttonText">Continuar estudo</text><rect x="252" y="318" width="110" height="46" rx="11" class="box"/><text x="277" y="347" class="label">Estrutura</text><text x="28" y="401" class="label">Resumo</text><rect x="28" y="416" width="334" height="64" rx="10" class="box"/><text x="44" y="443" class="body">Perfil: AraLearn reference</text><text x="44" y="464" class="small">2 overrides · acessibilidade padrão</text><text x="28" y="510" class="label">Detalhes e controle</text><rect x="28" y="525" width="334" height="52" rx="10" class="box"/><text x="44" y="557" class="body">Versão, fontes e proveniência</text><text x="338" y="557" class="body">›</text><rect x="28" y="587" width="334" height="52" rx="10" class="box"/><text x="44" y="619" class="body">Parâmetros e consequências</text><text x="338" y="619" class="body">›</text><rect x="28" y="649" width="334" height="52" rx="10" class="box"/><text x="44" y="681" class="body">Dependências e packages exigidos</text><text x="338" y="681" class="body">›</text><rect x="28" y="730" width="160" height="42" rx="10" class="box"/><text x="51" y="757" class="body">Remover download</text><rect x="202" y="730" width="160" height="42" rx="10" class="box"/><text x="235" y="757" class="body">Exportar dados</text></svg>