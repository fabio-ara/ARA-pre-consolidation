name: Enumerate substantive discussions
'on':
  push:
    branches: [consolidation-control]
permissions:
  contents: write
  pull-requests: read
  issues: read
jobs:
  enumerate:
    if: "github.event.head_commit.message == 'chore: stage social inventory'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPT_B64: ''
        run: |
          printf '%s' "$SCRIPT_B64" | base64 -d >/tmp/x.py
          python3 /tmp/x.py
          git rm .github/workflows/enumerate-social-inventory.yml
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: enumerate substantive discussions"
          git push origin HEAD:consolidation-control
