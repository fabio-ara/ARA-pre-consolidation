name: Complete Git inventory

'on':
  push:
    branches:
      - consolidation-control

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified inventory
        shell: bash
        env:
          NEW_RECORDS_GZ_B64: ''
          STATUS_GZ_B64: ''
          VALIDATOR_GZ_B64: ''
        run: |
          set -euo pipefail
          test "$(wc -l < SOURCE_INVENTORY.jsonl)" -eq 363
          printf '%s' "$NEW_RECORDS_GZ_B64" | base64 -d | gzip -d > /tmp/new-records.jsonl
          test "$(wc -l < /tmp/new-records.jsonl)" -eq 110
          cat /tmp/new-records.jsonl >> SOURCE_INVENTORY.jsonl
          printf '%s' "$STATUS_GZ_B64" | base64 -d | gzip -d > CONSOLIDATION_STATUS.yaml
          printf '%s' "$VALIDATOR_GZ_B64" | base64 -d | gzip -d > /tmp/validate.py
          python3 /tmp/validate.py
          git rm .github/workflows/complete-git-inventory.yml
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: complete Git snapshot inventory"
          git push origin HEAD:consolidation-control
