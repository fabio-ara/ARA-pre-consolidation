name: Audit purpose and scope
on: [push]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby .github/audit-purpose-scope.rb
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/audit-purpose-scope.yml .github/audit-purpose-scope.rb
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git commit -m "chore: verify purpose and scope domain"
          git push
