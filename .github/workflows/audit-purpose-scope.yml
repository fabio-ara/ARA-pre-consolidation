name: Audit purpose and scope
on: [push]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/status_counts = purpose.tally { |record| record.fetch("status") }/status_counts = purpose.map { |record| record.fetch("status") }.tally/' .github/audit-purpose-scope.rb
          sed -i 's/final_counts = records.tally { |record| record.fetch("status") }/final_counts = records.map { |record| record.fetch("status") }.tally/' .github/audit-purpose-scope.rb
          sed -i 's/Base64.decode64(object.fetch("content"))/Base64.decode64(object.fetch("content")).force_encoding("UTF-8")/' .github/audit-purpose-scope.rb
          ruby .github/audit-purpose-scope.rb
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/audit-purpose-scope.yml .github/audit-purpose-scope.rb
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git commit -m "chore: verify purpose and scope domain"
          git push
