name: Process initial purpose and scope batch
on:
  push:
    branches: [consolidation-control]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  process:
    if: github.event.head_commit.message == 'chore: stage purpose and scope processing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify coverage and update control
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPT_B64: '   '
        run: |
          printf '%s' "$SCRIPT_B64" | base64 -d >/tmp/process.py
          python /tmp/process.py
      - name: Commit final control state
        shell: bash
        run: |
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/process-purpose-scope.yml
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git commit -m "chore: process initial purpose and scope batch"
          git push
