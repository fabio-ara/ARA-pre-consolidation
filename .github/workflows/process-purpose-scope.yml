name: Process purpose and scope
on: [push]
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/process-purpose-scope.py
      - run: |
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/process-purpose-scope.yml .github/process-purpose-scope.py
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git commit -m "chore: process initial purpose and scope batch"
          git push
