name: Process initial purpose and scope batch
on:
  push:
    branches:
      - consolidation-control
permissions:
  contents: write
jobs:
  process:
    if: github.event.head_commit.message == 'chore: run purpose and scope processing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory and status
        run: python .github/process-purpose-scope.py
      - name: Commit final control state
        run: |
          git config user.name "ARA consolidation control"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/process-purpose-scope.yml .github/process-purpose-scope.py
          git add CONSOLIDATION_STATUS.yaml SOURCE_INVENTORY.jsonl
          git commit -m "chore: process initial purpose and scope batch"
          git push
