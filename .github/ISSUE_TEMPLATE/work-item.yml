name: Work item
description: Propose executable product, engineering, documentation, legal or operational work
title: "[AREA] "
body:
  - type: markdown
    attributes:
      value: |
        Issues form the canonical ARA backlog. Requirements must be understandable from the repository without relying on private conversations or unrecorded instructions.
  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: Describe the current situation, affected users and the problem to solve.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: State the observable result expected when this issue is complete.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and governing decisions
      description: Link relevant sources, requirements, research records, legal materials or decision documents. Distinguish evidence from hypothesis or preference.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included in this issue.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: State related work that must not be absorbed into this issue.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking issues, decisions, research or external dependencies.
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: Impact assessment
      description: Address pedagogical, research, data, privacy, security, accessibility, licensing, legal, deployment and migration effects as applicable.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Proposed approach
      description: Describe the implementation, investigation or documentation approach without expanding beyond scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide a verifiable checklist of completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and evidence
      description: Define tests, reviews, inspections, measurements or records required to demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation and language variants
      description: List documents to update and the required English, pt-BR and pt-PT variants.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Repository rules
      options:
        - label: I have read the repository governance and contribution policies.
          required: true
        - label: Work discovered outside this scope will be recorded in a linked issue.
          required: true
