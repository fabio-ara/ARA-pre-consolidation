name: Research work
description: Propose bibliographic, empirical, methodological or institutional research
title: "[RESEARCH] "
body:
  - type: markdown
    attributes:
      value: |
        Research work must preserve reproducibility, source status, ethical limits and traceability to product requirements.
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: Define the problem or knowledge gap without assuming the answer.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Questions and objectives
      description: State research questions, review questions or investigation objectives.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale and relation to ARA
      description: Explain why the work is relevant to learners, research capability, pedagogy, analytics, governance, UX or architecture.
    validations:
      required: true
  - type: textarea
    id: prior_sources
    attributes:
      label: Prior sources and current evidence
      description: List known sources and classify them as full text verified, abstract only, secondary citation, official source or pending access.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method or review protocol
      description: Define databases or corpora, search strategy, inclusion criteria, extraction fields, participants, instruments or analysis as applicable.
    validations:
      required: true
  - type: textarea
    id: ethics
    attributes:
      label: Ethics, data protection and legal considerations
      description: Address consent, privacy, restricted sources, copyright, institutional approval and data retention as applicable.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: List protocols, datasets, evidence maps, syntheses, taxonomies, requirements or decision records to produce.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      placeholder: |
        - [ ] Search and source status are reproducible
        - [ ] Included evidence is extracted and cited
        - [ ] Limitations and contradictory evidence are recorded
        - [ ] Product implications are separated from research findings
    validations:
      required: true
  - type: textarea
    id: missing_sources
    attributes:
      label: Sources or access still required
      description: Identify articles, books, chapters, instruments or institutional materials that must be requested.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Research rules
      options:
        - label: I will distinguish evidence, inference, hypothesis and preference.
          required: true
        - label: Restricted full texts and participant data will not be published without authorization.
          required: true
