last_batch: >-
  Última fonte primária de versionamento e proveniência, SRC-000017, processada.
  A fonte é uma issue de governança de propriedade intelectual e marcas e não registra
  resultado jurídico concluído. A separação entre software, documentação, conteúdos
  educacionais, dados de pesquisa, materiais de terceiros, contribuições e identidade
  já está preservada em LICENCIAMENTO.md; a política de identidade, a ausência de alegação
  de marca registrada e as pendências de buscas e titularidade já estão em MARCAS.md e
  PROV-003. O conteúdo residual sobre inventário datado de antecedentes, incluindo
  AraLearn e AraTalk, e possíveis vínculos universitários ou empregatícios foi destinado
  à análise de titularidade, sem publicação de correspondência sensível nem opinião
  jurídica definitiva. A exigência histórica de políticas públicas trilíngues foi
  considerada superada por DEC-002. Nenhuma alteração pública ou nova decisão foi
  necessária. Não restam fontes primárias identified no domínio.

next_step: >-
  Auditar o domínio versionamento e proveniência, conferindo as 32 fontes primárias
  SRC-000008 a SRC-000012, SRC-000017, SRC-000060, SRC-000098 a SRC-000100,
  SRC-000140, SRC-000141, SRC-000145, SRC-000149, SRC-000150, SRC-000154,
  SRC-000156, SRC-000220 a SRC-000222, SRC-000247, SRC-000253 a SRC-000256 e
  SRC-000355 a SRC-000361. Verificar cobertura e destinos; coerência de VER-001,
  VER-002, PROV-001 a PROV-004, ACCESS-001, PUB-001 e INF-001 com DEC-002,
  DEC-004, DEC-005 e DEC-007; separação entre licenciamento, identidade, acesso,
  proveniência, armazenamento e semântica de revisão; ausência de promoção de
  checkpoints, restauração não destrutiva, acesso derivacional, retenção, provedor,
  stack, schema, granularidade ou regras de marca a decisões não aprovadas; preservação
  das evidências públicas e ausência de referências privadas nos documentos públicos
  afetados. Se a auditoria passar, promover as fontes do domínio a verified, marcar
  versionamento_e_proveniencia como verified e registrar o próximo domínio exato.