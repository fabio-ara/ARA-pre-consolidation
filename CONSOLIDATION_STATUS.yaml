last_batch: >-
  Frente de pesquisa sobre tecnologia, versionamento e economia de armazenamento processada
  em seis fontes: SRC-000097, SRC-000146, SRC-000147, SRC-000153, SRC-000157 e
  SRC-000230. As seis fontes foram consideradas relevantes e processadas. O PR de pesquisa
  preserva a correção de que AraLearn é referência funcional e caso de contraste, não
  arquitetura modular equivalente, e organiza questões de inventário de objetos versionados,
  fronteiras entre metadados, artefatos e estado local, endereçamento por conteúdo,
  deduplicação, retenção e garbage collection por referências, workloads, custo,
  disponibilidade, backup, exportação, restauração e administração compreensível do
  armazenamento. A versão v2 do pré-backlog substitui a v1 para leitura corrente e recoloca
  versionamento antes da escolha física de armazenamento; a v1 conserva como conteúdo
  residual próprio a preocupação explícita com comunicar espaço, crescimento, custo
  estimado, objetos órfãos e consequências de limpeza. O mapa estruturado de trinta
  alternativas em nove camadas foi preservado como espaço histórico de comparação. Rótulos
  como candidate, recommended, candidate-baseline, principal-hypothesis e equivalentes não
  conferem autoridade vigente. A comparação ampla de topologias, BaaS, armazenamento local,
  sincronização, hospedagem, aplicação, frameworks e carregamento de capacidades foi
  mantida como evidência, sem seleção técnica. Preços, quotas, políticas de pausa e
  capacidades de fornecedores constituem fotografia temporal de agosto de 2026 e exigem
  revalidação futura conforme RES-002. O documento público
  docs/evidencias/arquitetura-infraestrutura-factibilidade-2026-08.md foi ampliado com a
  evolução R v1 para R v2, o mapa das trinta alternativas, critérios de revalidação e
  critérios consolidados para comparação futura. O commit público alterou somente esse
  documento, com noventa e sete adições e uma remoção correspondente à ampliação do recorte
  temporal de 3 de agosto para 3 a 5 de agosto. BACKLOG.yaml e DECISOES.md não foram
  alterados. Buscas públicas não localizaram o nome do repositório de origem, a branch de
  controle, identificadores SRC-* nem o marco interno do corpus. Nenhum provider, plano,
  banco, object storage, engine de sincronização, framework, cliente, runtime, schema ou
  stack foi aprovado. A substituição integral do inventário foi auditada com exatamente seis
  adições e seis remoções, somente nas seis fontes previstas. Nenhuma nova decisão foi
  criada.

next_step: >-
  Processar somente SRC-000044, SRC-000052 e SRC-000450, lote final de fontes primárias do
  domínio infraestrutura e armazenamento. Tratar SRC-000044 e SRC-000052 como itens do
  programa prematuro de implementação R0 e R3, ambos encerrados como not_planned, preservando
  somente critérios residuais não executáveis que ainda não estejam cobertos por INF-001,
  SCOPE-002, EXP-005, EXP-009, VER-002, PROV-004, ACCESS-002, DATA-002, DATA-003, VAL-001,
  VAL-002, DEC-006 e DEC-007. Não reativar releases, dependências, critérios executáveis,
  TypeScript, React, Vite, PWA, PostgreSQL, OIDC, Supabase, armazenamento S3-compatible ou
  qualquer baseline de implementação. Tratar SRC-000450 como decisão provisória histórica de
  fronteiras para execução de código não confiável: preservar a separação entre resposta de
  código, validação pública, validação protegida, serviço de execução, garantia de isolamento,
  política de recursos e evidência diagnóstica; distinguir execução local de baixo risco de
  validação protegida; manter como hipótese a exigência de ambiente confiável para testes
  protegidos e como não selecionadas as tecnologias concretas de isolamento. Web Worker e
  Node vm devem ser registrados apenas como rejeitados naquele recorte para função de sandbox
  produtiva, sem converter a rodada em decisão atual. Container e microVM permanecem categorias
  de alternativa, não escolhas. Confrontar também com MODEL-003, PED-004, EXP-009 e o futuro
  domínio de implantação e interoperabilidade para não antecipar runtime ou política de
  execução. Após o lote, verificar se nenhuma fonte primária de infraestrutura e armazenamento
  permanece identified e, se a cobertura estiver completa, registrar a auditoria integral do
  domínio como próximo passo.