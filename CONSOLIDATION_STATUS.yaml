last_batch: >-
  Auditoria do domínio parametrização e experimentação concluída sobre as vinte e seis
  fontes primárias SRC-000019, SRC-000082, SRC-000084 a SRC-000088, SRC-000142,
  SRC-000143, SRC-000227, SRC-000278 a SRC-000286, SRC-000325 a SRC-000329,
  SRC-000453 e SRC-000465. As vinte e cinco fontes substantivas e o manifesto
  estrutural anteriormente descartado foram promovidos ao estado operacional verified,
  preservando destinos, notas e relevant=false de SRC-000278. A cobertura canônica foi
  conferida contra PARAM-001, PARAM-002, SCOPE-005, PED-004, PED-010, AGENT-001,
  RES-002, VAL-001, VAL-002, DEC-006, DEC-007 e os dois documentos públicos de
  evidências do domínio. Rótulos históricos accepted, decision, normative, passed e
  accepted-normative-handoff permanecem descrições do corpus e não decisões vigentes.
  AraLearn permanece referência funcional e caso de contraste, não default universal
  nem arquitetura modular equivalente. Os 205 registros, 38 perfis, cinquenta dimensões
  P3, nove perfis P3 e o modelo histórico de precedência permanecem evidência ou
  alternativas de investigação. O corpus bibliográfico P3 de trinta e quatro registros
  está preservado com limitações de população, domínio, desenho e transferência. A
  correção v2 do pré-backlog de agentes qualifica adequadamente Q01, Q10, Q26 e a
  sequência sem apagar Q02 a Q09 e Q11 a Q25 da v1. Buscas no repositório público não
  localizaram referências ao repositório de origem, à branch de controle, a
  identificadores SRC-* ou ao marco interno do corpus. Nenhum schema, provedor, MCP,
  modelo adaptativo, analytics, UI, arquitetura, stack ou implementação foi selecionado.
  Nenhuma alteração pública adicional foi necessária. A promoção no inventário foi
  auditada com exatamente vinte e seis adições e vinte e seis remoções, somente em
  SOURCE_INVENTORY.jsonl. O domínio parametrizacao_e_experimentacao está verified e
  nenhuma nova decisão foi criada.

next_step: >-
  Processar somente SRC-000020, SRC-000089, SRC-000114, SRC-000128 e SRC-000287 a
  SRC-000296, primeiro lote de dados e pesquisa educacional. O lote reúne a Issue 5, o
  PR de fechamento, o ADR histórico de separação de dados, a especificação de protocolos
  e analytics e os dez artefatos estruturados do framework integrado. Confrontar o
  conteúdo com RES-001, RES-002, PED-003, PROV-004, VAL-001, VAL-002, PARAM-001,
  PARAM-002, ACCESS-002, DEC-006 e DEC-007. Separar pergunta e finalidade, protocolo,
  condição e atribuição, evento autorizado ou instrumento, evidência, medida, construto,
  interpretação e decisão ou intervenção sem inferir automaticamente uma camada da
  anterior. Tratar o rótulo histórico ara.research-framework.v1 e expressões accepted,
  normative handoff, normative objects e passed como autoridade histórica do corpus,
  não como decisão pública atual. Preservar o corpus de vinte e quatro fontes, o
  vocabulário histórico de vinte e quatro eventos, as dezesseis medidas candidatas,
  quatorze famílias de instrumentos, quinze regras de governança e doze cenários somente
  conforme seu valor residual de evidência e investigação, sem copiá-los automaticamente
  como contratos. Manter o perfil pessoal data-minimal como referência candidata, não
  regra universal; separar analytics pessoais, pedagógicos, de pesquisa e operacionais;
  preservar minimização, finalidade, pseudonimização, consentimento quando aplicável,
  retirada, retenção, acesso, exportação e inferências proibidas como problemas de
  governança a consolidar. Caliper, xAPI, QTI, DDI, PROV-O, RO-Crate e DPV permanecem
  mapeamentos candidatos, não semântica do ARA. Não aprovar plano de dados segregado,
  PostgreSQL, banco ou schema, event store, LRS, warehouse, dashboard, modelo preditivo,
  coleta de participantes, fórmulas, thresholds, padrões de interoperabilidade,
  arquitetura, UX, stack ou implementação. Não processar ainda P4 nem o pacote de
  analytics participativo de agentes; eles ficam para lotes subsequentes do domínio.