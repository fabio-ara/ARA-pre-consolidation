last_batch: >-
  Primeiro lote de relação com a pesquisa acadêmica processado em SRC-000015,
  SRC-000106, SRC-000127, SRC-000362, SRC-000363, SRC-000461, SRC-000472 e
  SRC-000473. Foram preservados como conteúdo metodológico substantivo a orientação
  geral de reprodutibilidade e estados de acesso, o esquema de extração adaptado ao
  desenho do estudo, o registro estruturado de fontes e o protocolo mestre histórico
  de revisão de escopo programática. A evidência pública materializa pergunta,
  estratégia efetivamente executada, procedência, acesso, deduplicação, triagem,
  extração, qualidade, limitações, ética, direitos autorais e alterações prospectivas,
  sempre separando achado, interpretação, inferência, hipótese e implicação para o ARA.
  JBI 2024 e PRISMA-ScR foram preservados somente como referências metodológicas
  históricas sujeitas a revalidação; nenhuma busca foi declarada executada apenas por
  estar planejada e nenhum levantamento recebeu classificação formal de revisão sem
  auditoria específica. O template de issue, o índice operacional e os templates de
  busca e triagem foram classificados relevant=false porque sua substância está
  integralmente coberta pelas fontes metodológicas e o mecanismo administrativo foi
  superado por DEC-001, DEC-002 e DEC-007. RES-001, RES-002 e RES-003 permaneceram
  abertos e inalterados, assim como BACKLOG.yaml e DECISOES.md. Quatro fontes são
  relevant=true e quatro relevant=false; todas as oito ficaram processed.

next_step: >-
  Processar somente SRC-000182 a SRC-000191, os dez registros de busca de 2 de agosto
  de 2026, como segundo lote exato de relação com a pesquisa acadêmica. Ler
  integralmente os registros de exploração de aplicativos e sistemas, extração de
  revisões centrais, execução, validação e conclusão da primeira busca formal e o
  scoping de ambientes interativos; distinguir estratégia planejada, busca
  efetivamente executada, fonte acessada, contagem, triagem, deduplicação, limitação
  de acesso e inferência posterior; confrontar com RES-001, RES-002 e
  docs/evidencias/metodologia-levantamento-bibliografico-2026-08.md. Encerrar sem
  avançar para SRC-000192 ou posteriores, bibliografias, corpora estruturados, issues,
  pull requests, comentários ou revisões.
