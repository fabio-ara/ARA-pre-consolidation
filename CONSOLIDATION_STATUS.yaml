last_batch: >-
  Auditoria do domínio versionamento e proveniência concluída sobre 32 fontes primárias.
  As 26 fontes substantivas têm destinos explícitos e as seis fontes descartadas por
  duplicação, supersessão ou redundância estrutural conservaram as justificativas e foram
  promovidas, junto com as demais, a verified. VER-001 e PROV-001 permanecem os únicos
  itens aprovados próprios do domínio sob DEC-004 e DEC-005. VER-002, PROV-002,
  PROV-003, PROV-004, ACCESS-001, PUB-001 e INF-001 mantêm estado não aprovado e
  preservam checkpoints, restauração não destrutiva, completude lógica, múltiplos pais,
  licenciamento de conteúdos, titularidade e marcas, proveniência operacional, retenção,
  acesso derivacional e alternativas físicas como pendências ou alternativas. Os dois
  documentos públicos de evidências permanecem históricos e não normativos; preços,
  quotas e capacidades de provedores são evidência temporal sujeita a revalidação.
  Nenhum modelo de ACL, provedor, BaaS, mecanismo de armazenamento, biblioteca de grafo,
  stack, schema, granularidade ou política de retenção foi selecionado. A documentação
  pública auditada não contém referência ao repositório de origem, à branch de controle
  ou ao marco interno do corpus. Nenhuma nova decisão ou alteração pública adicional foi
  necessária durante a auditoria.

next_step: >-
  Processar somente SRC-000054, SRC-000062, SRC-000105, SRC-000112 e SRC-000122 a
  SRC-000124, primeiro lote do domínio colaboração e acesso. Confrontar a issue de
  colaboração e acesso, o baseline inicial de governança, a configuração de templates,
  o ADR histórico de autenticação e autorização e os documentos de governança do
  repositório em inglês, pt-BR e pt-PT com ACCESS-001, PUB-001, AUTH-002, DEC-001,
  DEC-002, DEC-006 e DEC-007. Distinguir governança do repositório de autorização do
  produto, autenticação de identidade de autorização sobre conteúdo e papéis
  administrativos de acesso cotidiano. Deduplicar versões linguísticas segundo DEC-002
  sem perder cláusulas substantivas. Tratar OIDC, OAuth, RBAC, ABAC, policies, providers
  de identidade e mecanismos equivalentes somente conforme as fontes sustentarem e sem
  promovê-los a decisões atuais. Não reativar programa de implementação, não selecionar
  provedor de identidade, modelo de ACL, schema, framework ou política de acesso. Após
  o lote, verificar se restam fontes primárias identified em colaboração e acesso e
  definir o próximo conjunto exato.