  custo, funcionamento em dispositivos modestos e comportamento explícito diante de
  capacidades ausentes. Não processar ainda SRC-000044, SRC-000052, SRC-000097,
  SRC-000146, SRC-000147, SRC-000153, SRC-000157, SRC-000230 ou SRC-000450, nem
