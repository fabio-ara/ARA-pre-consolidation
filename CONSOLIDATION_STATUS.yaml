last_batch: >-
  Primeiro lote de versionamento e proveniência processado em SRC-000008 a SRC-000012.
  O aviso de licença da documentação foi preservado publicamente em português do Brasil,
  mantendo CC BY 4.0 e suas exclusões sem ampliar a cobertura jurídica. LICENSING.pt-BR.md
  foi consolidado como fonte principal para distinguir código, documentação, conteúdos
  educacionais, dados de pesquisa, materiais de terceiros, identidade e contribuições;
  as versões inglesa e pt-PT foram descartadas como duplicações linguísticas sem conteúdo
  material exclusivo conforme DEC-002. A política de identidade foi preservada sem alegar
  marca registrada e sem usar o símbolo de registro. O repositório público recebeu
  LICENSE-DOCUMENTATION.md, LICENCIAMENTO.md e MARCAS.md, e README.md passou a explicitar
  esses limites. PROV-002 e PROV-003 foram registrados como pendências captured para
  licenciamento de cursos e recursos e proteção formal da identidade. Nenhuma nova decisão
  de produto foi criada e nenhuma interpretação jurídica além das fontes foi materializada.

next_step: >-
  Processar somente SRC-000060, SRC-000099, SRC-000100, SRC-000140, SRC-000141,
  SRC-000149, SRC-000156 e SRC-000247, núcleo de semântica de revisões, histórico e
  proveniência operacional do domínio versionamento e proveniência. Confrontar a Issue 79,
  os PRs 83 e 84, o ledger pós-PR80, o registro de decisões aceitas, a síntese de
  proveniência e retenção e a síntese v2 de alternativas com PROV-001, VER-001, DEC-004,
  DEC-005, DEC-006 e DEC-007. Preservar como decisões somente o que já estiver aprovado
  no repositório canônico; tratar materialização lógica, checkpoints, retenção, receipts,
  manifests, content addressing, event sourcing, IndexedDB, banco, object storage e demais
  mecanismos como requisitos candidatos ou alternativas conforme sua autoridade. Destinar
  regras de audiência, atenuação e revogação ao domínio colaboração e acesso, sem promovê-las
  neste lote. Não selecionar stack, provider, schema físico ou política de retenção.
