last_batch: >-
  Terceiro lote de implantação e interoperabilidade processado em SRC-000432 a
  SRC-000443, correspondente ao protótipo external-adapters-01. As doze fontes foram
  consideradas relevantes e registradas como processed. A rodada confronta três
  bibliotecas externas candidatas com a fronteira experimental de componentes: MathLive
  e mapeamento orientado a MathJSON, Cytoscape.js e Recogito Text Annotator. Somente os
  wrappers escritos para o experimento, seus fixtures e quatro testes Node foram
  executados; MathLive, Cytoscape.js e Recogito não foram instalados, empacotados nem
  executados. O relatório registra quatro de quatro testes de boundary aprovados para
  projeção de estado de forma semelhante às bibliotecas em dados canônicos e para
  preservação dos documentos usados do lado do curso. Esse resultado não demonstra
  compatibilidade real de runtime, acessibilidade, desempenho, bundle, comportamento de
  interface ou adequação pedagógica das bibliotecas. A execução dos candidatos ficou
  historicamente deferred porque o ambiente não resolvia hosts externos nem oferecia os
  pacotes no espelho; a própria fonte registra explicitamente que isso não constitui
  falha das bibliotecas. A auditoria de fontes oficiais preservou como fotografia temporal
  MathLive 0.110.0 sob MIT, Cytoscape.js no commit auditado com versão
  3.35.0-unstable e versão estável observada 3.34.0 sob MIT e Recogito Text Annotator
  4.2.5 sob BSD-3-Clause. Esses dados precisam ser revalidados antes de qualquer decisão
  futura. O campo histórico ARA_decision e a expressão source-compatible candidate foram
  reclassificados como avaliação situada da rodada, sem autoridade canônica. O wrapper
  MathLive cobre somente um subconjunto de MathJSON e não recebe autoridade de prova ou
  correção; o wrapper Cytoscape remove geometria, estilo, classes, seleção e scratch data;
  o wrapper Recogito preserva seletores textuais e digest da fonte sem importar DOM,
  geometria ou store interno. Esses resultados preservam a hipótese de fronteiras
  substituíveis sem selecionar biblioteca, API ou schema. O repositório público recebeu
  docs/evidencias/adapters-externos-2026-08.md e o artefato reproduzível em
  docs/evidencias/prototipos/adapters-externos-01/. A comparação desde o head público
  anterior mostrou exatamente treze arquivos novos, nenhuma remoção e nenhuma alteração
  de arquivo preexistente: uma síntese e doze arquivos do artefato. BACKLOG.yaml e
  DECISOES.md permaneceram inalterados porque MODEL-003, EXP-007, EXP-008, EXP-009,
  PED-004, INF-001, VAL-001, VAL-002, SCOPE-005, DEC-006 e DEC-007 já cobrem o conteúdo
  residual. As buscas públicas não localizaram o nome do repositório de origem, a branch
  de controle, identificadores SRC-* nem o marco interno do corpus. A substituição do
  inventário foi auditada com exatamente doze adições e doze remoções, somente nas doze
  fontes previstas. Nenhuma biblioteca, versão, package manager, adapter API, lifecycle,
  MathJSON como semântica interna, renderer, runtime, schema, stack, arquitetura ou
  implementação foi aprovada. Nenhuma nova decisão foi criada.

next_step: >-
  Processar somente SRC-000445, lote final primário do domínio implantação e
  interoperabilidade. Tratar a atualização sobre programação móvel de 2023 a 2026 como
  síntese de pesquisa e confrontá-la com a Issue 18 já verificada, o corpus estruturado
  SRC-000316, EXP-004, EXP-007, EXP-010, MODEL-003, PED-004, SCOPE-004, SCOPE-005,
  INF-001, VAL-001, VAL-002, DEC-006 e DEC-007. Separar capacidades observadas em
  ambientes e estudos de programação móvel de evidência de aprendizagem, preferência de
  usuário, factibilidade técnica e requisito do ARA. Preservar diferenças entre tarefas,
  dispositivos, modalidades de execução, feedback, avaliação, continuidade e limites de
  transferência sem promover qualquer aplicativo, linguagem, runtime, editor, biblioteca,
  plataforma ou arquitetura. Não inferir efetividade educacional a partir de uso,
  engajamento, satisfação, conclusão ou resultados transversais. Não realizar nova
  pesquisa externa extensa: lacunas normais devem permanecer pendências futuras. Após
  processar SRC-000445, verificar se resta alguma fonte primária de implantação e
  interoperabilidade em identified; se a cobertura estiver completa, registrar a
  auditoria integral do domínio como próximo passo.