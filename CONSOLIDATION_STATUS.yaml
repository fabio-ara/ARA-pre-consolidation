  tarefas, métodos de walkthrough, acessibilidade, dispositivo, localização e injeção
  de falhas, critérios candidatos e pacote de evidências; não autorizava recrutamento
  nem coleta. MCP, outbox, expected revision, URLs assinadas, CapabilityManifest,
  Galaxy A07, locales en/pt-BR/pt-PT, alvo WCAG 2.2 AA e contratos de tela históricos
  não foram promovidos a requisitos ou decisões. O método residual foi materializado
  em docs/evidencias/metodos-avaliacao-validacao-2026-08.md; BACKLOG.yaml e
  DECISOES.md permaneceram inalterados. As duas fontes foram registradas como
  processed e relevant=true.

