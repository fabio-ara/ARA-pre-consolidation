last_batch: >-
  Segundo lote de avaliação e validação processado em SRC-000048 e SRC-000058.
  As duas fontes pertenciam ao programa de implementação R1/R5 posteriormente
  encerrado como not_planned. Foram preservados somente critérios residuais de
  investigação e evidência: estado contextual e retomada recuperável, funcionamento
  sem rede, acessibilidade e factibilidade medidas, migração explícita sem reparo
  semântico silencioso, revisão de ambiguidades, conformidade comparável entre perfis,
  workloads medidos, backup, restauração, atualização, rollback e registro de
  limitações e capacidades não suportadas. MODEL-004 permanece pendente de aprovação;
  EXP-005, VAL-001, VAL-002, PED-004, INF-001 e as evidências públicas existentes
  cobrem o conteúdo residual. Releases, objetos executáveis, suítes R0-R5, gates de
  release, Galaxy A07 como gate, checksums, attestations, instalação self-hosted e
  fechamento ARA v1 não foram promovidos. DEC-007 prevalece. O repositório público
  permaneceu inalterado e nenhuma nova decisão foi criada. SRC-000048 e SRC-000058
  foram registradas como processed e relevant=true.

