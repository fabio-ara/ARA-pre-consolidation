last_batch: >-
  Pacote P4 de instrumentação, condições, analytics e governança processado nas cinco
  fontes SRC-000330 a SRC-000333 e SRC-000459. Todas foram classificadas como
  relevantes e processadas. O repositório público recebeu
  docs/evidencias/p4-instrumentacao-analytics-governanca-2026-08.md como evidência
  histórica e não normativa, em uma única adição auditada de 285 linhas e sem alteração
  de BACKLOG.yaml ou DECISOES.md. O documento preserva o corpus P4 de trinta e seis
  registros entre literatura acadêmica, especificações, legislação, orientações
  regulatórias, frameworks, políticas institucionais, princípios de governança e padrões
  técnicos; as trinta e uma dimensões históricas; nove perfis de contraste; uma ordem
  candidata de oito níveis de precedência; recomendações, caminhos não recomendados,
  adiamentos e não autorizações. A presença de uma fonte no corpus não implica adoção, e
  versões, vigência e aplicabilidade de materiais normativos ou temporais exigem
  revalidação conforme RES-002. Os rótulos accepted, decision, recommendedPath,
  acceptedParameterIds, completed-package e formulações equivalentes permanecem
  autoridade histórica do pacote, não decisão pública atual. O perfil pessoal
  data-minimal continua referência funcional e caso de contraste, não default aprovado.
  DATA-001, DATA-002 e DATA-003 já cobrem os problemas residuais, por isso nenhum novo
  item de backlog foi criado. Eventos, medidas, construtos e interpretações permanecem
  distintos; rastros brutos não autorizam inferências diretas de aprendizagem, domínio,
  esforço, atenção, dificuldade ou qualidade. A precedência histórica, os nove perfis,
  identificadores, enums, valores, defaults, autoridades e políticas concretas não foram
  aprovados. Não foram selecionados event schema, métricas de produção, event store, LRS,
  warehouse, dashboard, early warning, modelo preditivo, coleta com participantes,
  arquitetura, UX, stack ou implementação. A escrita do inventário foi auditada com
  exatamente cinco adições e cinco remoções, somente em SOURCE_INVENTORY.jsonl. Buscas
  no repositório público não localizaram o nome do repositório de origem, a branch de
  controle, identificadores SRC-* nem o marco interno do corpus. Nenhuma nova decisão foi
  criada.

