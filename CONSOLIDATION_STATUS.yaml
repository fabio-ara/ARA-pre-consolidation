last_batch: >-
  Primeiro lote de dados e pesquisa educacional processado em quatorze fontes:
  SRC-000020, SRC-000089, SRC-000114, SRC-000128 e SRC-000287 a SRC-000296.
  Treze fontes foram processadas como relevantes e SRC-000287 foi descartado como
  manifesto estrutural sem conteúdo intelectual residual exclusivo. O repositório
  público recebeu docs/evidencias/protocolos-dados-analytics-2026-08.md como evidência
  histórica e não normativa, em uma única adição de 308 linhas. O documento preserva
  a cadeia entre pergunta e finalidade, protocolo, condição e atribuição, evento
  autorizado ou instrumento, evidência, medida, construto, interpretação e decisão ou
  intervenção; vinte e quatro fontes ou antecedentes; vinte e quatro eventos históricos;
  dezesseis medidas candidatas; quatorze famílias de instrumentos; quinze regras de
  governança; doze cenários de coerência conceitual; quatro autoridades distintas de
  analytics e mapeamentos candidatos de interoperabilidade. BACKLOG.yaml recebeu
  DATA-001, DATA-002 e DATA-003, todos em pending_research, em uma alteração auditada
  com sessenta e uma adições e nenhuma remoção, sem modificar itens anteriores.
  DATA-001 mantém abertos protocolos, condições, atribuição e snapshots reproduzíveis;
  DATA-002 mantém governança, finalidade, minimização, identidade, pseudonimização,
  consentimento quando aplicável, retirada, retenção, acesso, exportação, uso secundário,
  dados sensíveis, transparência e incidentes; DATA-003 mantém instrumentação, medidas,
  analytics e interoperabilidade. O perfil pessoal data-minimal permanece referência
  candidata, não regra universal. Caliper, xAPI, QTI, DDI, PROV-O, RO-Crate e DPV
  permanecem mapeamentos candidatos e não semântica interna aprovada. O ADR histórico de
  separação de dados foi reclassificado como evidência de problemas de finalidade e
  isolamento: adapter, plano segregado, PostgreSQL, schema ou banco separado, pacotes
  imutáveis, LRS e warehouse não foram promovidos a arquitetura. Rótulos históricos
  accepted, normative handoff, normative objects e passed não criaram decisão vigente.
  Não houve coleta com participantes, seleção de fórmula ou threshold, event store,
  dashboard, modelo preditivo, schema, arquitetura, UX, stack ou implementação.
  DECISOES.md não foi alterado e nenhuma nova decisão foi criada. A escrita do inventário
  foi auditada com exatamente quatorze adições e quatorze remoções, somente em
  SOURCE_INVENTORY.jsonl. Buscas no repositório público não localizaram referências ao
  repositório de origem, à branch de controle nem a identificadores SRC-*.

next_step: >-
  Processar somente SRC-000330 a SRC-000333 e SRC-000459, pacote P4 de instrumentação,
