last_batch: >-
  Auditoria do domínio dados e pesquisa educacional concluída sobre trinta e uma fontes
  primárias: SRC-000020, SRC-000055, SRC-000089, SRC-000101, SRC-000114, SRC-000128,
  SRC-000136, SRC-000137, SRC-000151, SRC-000200, SRC-000202, SRC-000204, SRC-000205,
  SRC-000209, SRC-000210, SRC-000211, SRC-000287 a SRC-000296, SRC-000330 a SRC-000333
  e SRC-000459. A auditoria confirmou cobertura e destinos coerentes em DATA-001,
  DATA-002, DATA-003, AGENT-001, AUTH-002, PED-003, PROV-004, PARAM-001, PARAM-002,
  VAL-001, VAL-002 e INF-001, além dos quatro documentos públicos de evidências sobre
  protocolos e analytics, P4, perfis de agentes e factibilidade research-ready. Permanecem
  separadas as categorias fato operacional, evidência de pesquisa, evento, medida,
  construto, interpretação e decisão científica; disponibilidade técnica não concede
  autorização de coleta; analytics pessoais, pedagógicos, de pesquisa e operacionais têm
  finalidades e autoridades distintas; direitos de participantes e governança de dados
  não foram reduzidos a política jurídica universal; assistência analítica por inteligência
  artificial não recebeu autoridade científica. A correção v2 sobre AraLearn e evals foi
  preservada: AraLearn é contraste funcional, não arquitetura modular equivalente. O
  programa R4 permanece superado e encerrado como not_planned, enquanto a revisão de
  factibilidade posterior continua evidência não executável. Rótulos históricos accepted,
  normative handoff, normative objects, passed, decision, recommended, candidate e
  equivalentes não foram promovidos a decisão vigente. Fontes normativas ou temporais
  continuam sujeitas a revalidação futura conforme RES-002. Não foram aprovados event
  schema, EventRecord, TransformationReceipt, DecisionParse, objetos ou campos de
  pesquisa, fórmulas, limiares, métricas, perfis, precedências, políticas universais de
  consentimento, retenção, acesso ou exportação, PostgreSQL, plano segregado de dados,
  LRS, warehouse, event store, dashboard, early warning, modelo preditivo ou causal,
  coleta com participantes, provider, MCP, arquitetura, UX, stack ou implementação.
  SRC-000101, SRC-000211 e SRC-000287 conservaram relevant false, destination null e
  suas justificativas de descarte ao serem promovidas a verified. Buscas no repositório
  público não localizaram o nome do repositório de origem, a branch de controle,
  identificadores SRC-* nem o marco interno do corpus. Nenhuma alteração pública foi
  necessária durante a auditoria. A substituição integral do inventário produziu trinta e
  duas adições e trinta e duas remoções: trinta e uma são exclusivamente as promoções de
  status esperadas; a diferença adicional é uma correção gramatical sem mudança de sentido
  em SRC-000152, de 'vínculo a doze wireframes' para 'vínculo com doze wireframes'. A
  auditoria confirmou ausência de mudança de categoria, autoridade, relevância, destino ou
  conclusão, e a formulação foi mantida por proporcionalidade para evitar nova substituição
  integral do inventário. Nenhuma nova decisão foi criada.

next_step: >-
  Processar somente SRC-000022, SRC-000091, SRC-000109, SRC-000110, SRC-000118 e
  SRC-000306 a SRC-000309, primeiro lote do domínio infraestrutura e armazenamento.
  Ler a Issue 7, o PR 56, os ADRs históricos 0001 e 0002, a arquitetura de referência,
  o manifesto, a auditoria, a síntese decisória e os quality budgets como um pacote de
  arquitetura historicamente rotulado accepted ou normative handoff. Confrontar o pacote
  com INF-001, SCOPE-002, SCOPE-005, EXP-005, EXP-009, VER-002, PROV-004, DATA-002,
  DATA-003, ACCESS-002, AGENT-001, VAL-001, VAL-002, DEC-006 e DEC-007. Distinguir
  requisitos duráveis, restrições do primeiro recorte, perfis de implantação e hipóteses
  técnicas. Tratar TypeScript, React, Vite, PWA, Service Worker, Cache API, IndexedDB,
  OPFS, PostgreSQL, armazenamento S3-compatible, Supabase, OIDC, local-first híbrido,
  ports and adapters e demais escolhas históricas como alternativas ou recomendações
