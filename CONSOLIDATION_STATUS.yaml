last_batch: >-
  Auditoria do domínio interfaces e experiência de uso concluída sobre 31 fontes
  primárias. As 30 fontes relevantes têm destinos explícitos e SRC-000310 permanece
  como descarte justificado de manifesto estrutural redundante; todas passaram a
  verified. UX-001 e VER-001 permanecem aprovados sob DEC-003 e DEC-004, enquanto
  UX-002, UX-003 e UX-004 permanecem pending_research. O diretório público de interfaces
  separa explicitamente a composição desktop aprovada das doze explorações não normativas
  e do protótipo estrutural não normativo. A composição aprovada contém somente pastas e
  cursos visíveis no painel esquerdo e o grafo de revisões completas do curso na área
  principal. Navegação candidata, grafo interno de dependências, MCP, política trilíngue,
  WCAG 2.2 AA, tokens, bibliotecas de grafo, fluxos de pesquisa e administração e detalhes
  de implementação não foram promovidos. Não foram encontradas referências ao repositório
  de origem nem ao marco interno do corpus nos artefatos públicos auditados. Nenhuma nova
  decisão ou alteração pública adicional foi necessária.

next_step: >-
  Processar somente SRC-000008 a SRC-000012, primeiro lote do domínio versionamento e
  proveniência, composto por licenciamento da documentação, documentos gerais de
  licenciamento em inglês, pt-BR e pt-PT e política de marcas. Confrontar o conteúdo com
  LICENSE, README.md, DEC-002 e os itens vigentes de proveniência, distinguindo licença de
  código, documentação, dados, artefatos e uso de marcas conforme o que as próprias fontes
  sustentarem. Tratar duplicações linguísticas segundo DEC-002 sem perder cláusulas ou
  restrições substantivas. Não inferir cobertura jurídica não expressa, não transformar
  orientações históricas em decisão nova e não ampliar o escopo de licenciamento por
  interpretação. Após esse lote, definir o próximo conjunto do domínio a partir das fontes
  de grafo de versões e proveniência ainda identified.
