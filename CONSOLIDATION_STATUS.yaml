last_batch: >-
  Oitavo lote de relação com a pesquisa acadêmica processado em SRC-000470 e
  SRC-000471. Os dois registros de solicitação de textos integrais foram lidos
  integralmente e confrontados somente com evidência posterior existente no corpus.
  Xu 2024, Van Hoof 2023 e Carpenter 2023 permanecem com texto integral não
  recuperado no marco, em níveis de extração por resumo ou resumo detalhado; a
  ausência de recuperação não foi reclassificada como indisponibilidade. Odo 2024
  permanece planned, sem comprovação de solicitação externa ou recebimento.
  Agarwal et al. 2021 foi posteriormente resolvido por manuscrito aceito aberto e
  extração em texto integral, sem evidência de solicitação externa. Foi criado
  docs/evidencias/dados/estado-acesso-textos-prioritarios-2026-08.csv para
  preservar os cinco estados sem publicar PDFs ou detalhes administrativos.
  BACKLOG.yaml e DECISOES.md permaneceram inalterados. Ambas as fontes foram
  registradas como processed e relevant=true. Nenhuma pesquisa externa, download de
  texto, decisão de produto, requisito ou autorização de implementação foi criada.

next_step: >-
  Processar somente SRC-000016 e SRC-000172 a SRC-000181 como nono lote exato de
  relação com a pesquisa acadêmica. Ler integralmente as onze bibliografias,
  normalizar apenas o necessário para comparação, identificar duplicações entre
  elas e com os corpora e registros bibliográficos já preservados, distinguir
  referência bibliográfica de evidência efetivamente extraída e determinar quais
  registros bibliográficos precisam ser preservados publicamente para impedir
  perda de cobertura. Não completar metadados por pesquisa externa, não inferir
  acesso ou qualidade a partir de presença em .bib e não transformar bibliografia
  em evidência de eficácia. Encerrar sem avançar para issues, pull requests,
  comentários ou revisões.
