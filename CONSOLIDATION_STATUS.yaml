last_batch: >-
  Segundo lote da versão 0.2 do protótipo de componentes concluído: quatro fixtures
  0.1, quatro resultados esperados 0.2 e o script de migração processados. Nos casos
  controlados, representação, atividade, resposta, critérios e retorno pedagógico são
  preservados, enquanto a programação externaliza material protegido e as quatro
  famílias recebem metadados e políticas operacionais 0.2. O script aceita somente
  o contrato 0.1 e as quatro famílias conhecidas. O conjunto comprova conversão
  experimental reprodutível dos fixtures, não compatibilidade geral nem decisão de
  migração. EXP-005 já cobre a pendência pública e nenhuma decisão nova foi criada.

