last_batch: >-
  Primeiro lote multidomínio processado em SRC-000102, SRC-000103, SRC-000104 e
  SRC-000474 a SRC-000493. As três coleções agregadas foram validadas contra o
  inventário: os 86 comentários gerais correspondem a 81 comentários substantivos
  enumerados individualmente e cinco mensagens procedimentais contabilizadas somente
  em conjunto; as quatro revisões formais estão enumeradas em SRC-000555 a SRC-000558;
  não há comentários de revisão em linha nem anexos ou imagens no recorte registrado.
  As três coleções ficaram processed e relevant=false por terem função apenas de
  cobertura. Os vinte comentários foram lidos integralmente no estado do cutoff e
  ficaram processed e relevant=true. A maior parte confirma pesquisas, auditorias e
  protótipos já consolidados. As correções explícitas mais importantes impedem usar o
  corpus centrado em flashcards como fronteira da taxonomia, tratam card como unidade
  de orquestração e não como sinônimo de flashcard, distinguem representação,
  atividade, resposta, validação e retorno pedagógico e reclassificam os 18 recursos
  anteriores como sementes legadas situadas. Essas correções já estão preservadas em
  SCOPE-003, SCOPE-005, EXP-003, EXP-004, MODEL-001, MODEL-003 e evidências públicas;
  a linguagem forte dos comentários não foi promovida a decisão porque MODEL-001 a
  MODEL-005 continuam pending_owner_approval. Nenhum conteúdo residual exigiu nova
  alteração pública, de backlog ou de decisões.

next_step: >-
  Processar somente SRC-000494 a SRC-000513 como segundo lote exato multidomínio.
  Ler integralmente os vinte comentários no estado do cutoff e recuperar o contexto
  da issue ou pull request somente quando necessário para interpretar seu conteúdo.
  Separar confirmações e coordenação histórica de correções, decisões explícitas do
  responsável, evidências, conflitos, recomendações e pendências ainda válidas;
  confrontar qualquer residual com README.md, METODO_DE_TRABALHO.md, BACKLOG.yaml,
