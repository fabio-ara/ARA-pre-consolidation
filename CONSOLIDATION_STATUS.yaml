last_batch: >-
  Lote final primário de infraestrutura e armazenamento processado em SRC-000044,
  SRC-000052 e SRC-000450. SRC-000044 e SRC-000052 foram tratados como issues de
  implementação R0 e R3 encerradas como not_planned: somente critérios residuais de
  factibilidade, reprodutibilidade, separação entre domínio/aplicação e infraestrutura,
  independência de provedor, consistência entre metadados e artefatos, diagnóstico,
  backup, restore, migração e rollback foram preservados. Releases, dependências,
  TypeScript, React, Vite, PWA, Node, pnpm, PostgreSQL, OIDC, Supabase, armazenamento
  S3-compatible, APIs, migrations, fixtures e critérios executáveis não foram reativados.
  SRC-000450 foi preservada como síntese provisória histórica de fronteiras para execução
  de código não confiável: resposta de código, validação pública, validação protegida,
  serviço de execução, garantia de isolamento, política de recursos e evidência diagnóstica
  permanecem responsabilidades distintas. Execução funcional não demonstra isolamento nem
  autoridade avaliativa; execução local de baixo risco não equivale a validação protegida.
  Web Worker e Node vm permanecem rejeitados somente, naquele recorte histórico, como
  sandbox produtiva contra código hostil; container, microVM e runtimes de navegador são
  categorias ou alternativas não selecionadas. O conteúdo residual foi confrontado com
  INF-001, EXP-009, MODEL-003, PED-004 e VAL-002, sem necessidade de novo item de backlog.
  O repositório público recebeu
  docs/evidencias/fronteiras-execucao-codigo-nao-confiavel-2026-08.md como evidência
  técnica histórica e não normativa. Durante a materialização foi detectada duplicação
  transitória de um segundo documento sobre a mesma fonte; o arquivo redundante foi removido
  antes do fechamento do lote. O efeito líquido auditado desde o head público anterior é
  exatamente um arquivo novo, com cento e setenta e três linhas adicionadas e nenhuma
  remoção. BACKLOG.yaml e DECISOES.md não foram alterados. Buscas públicas não localizaram
  o nome do repositório de origem, a branch de controle, identificadores SRC-* nem o marco
  interno do corpus. Uma tentativa posterior de substituir o inventário foi rejeitada com
  conflito 409 por usar SHA já superado e não produziu escrita; a releitura confirmou que as
  três linhas já haviam sido materializadas por operação anterior. A comparação desde o
  estado de controle anterior mostra exatamente três adições e três remoções em
  SOURCE_INVENTORY.jsonl, somente nas três fontes previstas. Todas as dezoito fontes
  primárias de infraestrutura e armazenamento estão agora processed ou discarded; nenhuma
  permanece identified. Nenhuma nova decisão foi criada.

