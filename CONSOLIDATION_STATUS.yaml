last_batch: >-
  Núcleo documental e estruturado do antigo pacote UX processado em nove fontes:
  SRC-000023, SRC-000092, SRC-000133 e SRC-000310 a SRC-000315. O manifesto
  SRC-000310 foi descartado como enumeração estrutural redundante; as outras oito
  fontes foram processadas como evidência, propostas e artefatos de especificação.
  A cobertura interna de 36 contratos de tela, 15 jornadas e 22 mensagens não foi
  tratada como validação do produto, pois a própria auditoria registra ausência de
  avaliação com usuários. O repositório público recebeu UX-002 e UX-003 em
  pending_research para preservar arquitetura de informação responsiva e divulgação
  progressiva, além de estados transversais, recuperação e transparência operacional.
  DEC-003 e DEC-004 permanecem as únicas decisões vigentes de interface neste recorte;
  navegação completa, contratos de tela, MCP, política trilíngue, tokens, alvo WCAG e
  handoff de implementação não foram promovidos. DEC-007 continua prevalecendo sobre
  qualquer autorização de desenvolvimento.

next_step: >-
  Processar somente SRC-000061, SRC-000130, SRC-000131, SRC-000135, SRC-000152,
  SRC-000155 e SRC-000229, camada textual e estruturada remanescente de interfaces e
  experiência de uso antes dos artefatos visuais. Confrontar a issue canônica posterior
  do grafo e navegação com DEC-003, DEC-004 e DEC-005; tratar acessibilidade/localização,
  design system, administração de perfis de agente, rascunho de telas, catálogo e opções
  de renderização como evidências, requisitos candidatos ou alternativas conforme sua
  autoridade. Não promover política trilíngue, WCAG como requisito aprovado, tokens,
  catálogo de telas, MCP, bibliotecas de grafo ou mecanismos de acesso a decisões de
  produto. Após esse lote, deixar SRC-000014 e SRC-000158 a SRC-000171 para o lote
  visual e de protótipo.
