last_batch: >-
  SRC-000113, o ADR antigo do gateway MCP para autoria assistida, processado. A proposta
  técnica histórica de gateway dedicado não foi herdada como arquitetura. Foram
  preservadas somente fronteiras conceituais já cobertas por AGENT-001, AUTH-001,
  AUTH-002, CUR-001 e DEC-006: autorização explícita, contexto e operações delimitados,
  ausência de autoridade derivada da memória do chat, proveniência da operação e
  proibição de aprovação ou publicação implícita. MCP, OIDC/OAuth, contratos de
  ferramentas, request IDs, expected revisions, paginação, receipts, integração de
  clientes e topologia permanecem alternativas técnicas não aprovadas sob DEC-007.
  Nenhuma alteração pública ou nova decisão foi necessária. A auditoria do inventário
  removeu uma alteração colateral de redação fora do lote; o resultado líquido contém
  somente a mudança de SRC-000113. Com isso, as 21 fontes primárias do domínio estão
  processadas ou descartadas, sem fonte primária identified remanescente.

