last_batch: >-
  Lote visual e de protótipo de interfaces e experiência de uso processado em 15 fontes:
  SRC-000014 e SRC-000158 a SRC-000171. Os doze wireframes e o protótipo estrutural
  foram preservados publicamente como explorações não normativas, com autoridade
  explicitamente separada das decisões vigentes. Nenhum wireframe histórico correspondia
  integralmente à composição aprovada de DEC-003; por isso foi materializado um esquema
  público específico, limitado ao painel esquerdo de pastas e cursos visíveis e ao grafo
  principal de revisões completas do curso conforme DEC-003 e DEC-004, sem escolhas
  adicionais de layout, stack, interação ou permissões. DECISOES.md passou a apontar para
  esse artefato. O grafo de dependências interno, navegação candidata, MCP, perfis, fluxos
  de pesquisa e administração, valores visuais e código do protótipo permanecem evidência
  ou alternativas, não decisões. Nenhuma nova decisão de produto foi criada.

next_step: >-
  Auditar o domínio interfaces e experiência de uso, conferindo as 31 fontes primárias
  SRC-000014, SRC-000023, SRC-000061, SRC-000092, SRC-000130, SRC-000131, SRC-000133,
  SRC-000135, SRC-000152, SRC-000155, SRC-000158 a SRC-000171, SRC-000229 e
  SRC-000310 a SRC-000315. Verificar cobertura e destinos, a preservação dos artefatos
  visuais e do protótipo, a distinção entre o esquema aprovado e as explorações não
  normativas, coerência de UX-001 a UX-004 e VER-001 com DEC-003 a DEC-007, ausência de
  promoção indevida de navegação, MCP, política trilíngue, WCAG, tokens, bibliotecas de
  grafo ou fluxos candidatos e ausência de referência privada no diretório público de
  interfaces.
