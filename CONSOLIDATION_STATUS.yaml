last_batch: >-
  Núcleo de semântica de revisões, histórico e proveniência operacional processado em
  oito fontes: SRC-000060, SRC-000099, SRC-000100, SRC-000140, SRC-000141,
  SRC-000149, SRC-000156 e SRC-000247. A Issue 79 foi tratada como autoridade posterior
  dentro do corpus para distinguir mutação confirmada e persistida, checkpoint e revisão
  durável, mas somente DEC-004 e DEC-005 permanecem decisões vigentes no repositório
  público. O backlog público recebeu VER-002 e PROV-004 em pending_research e INF-001 foi
  enriquecido com alternativas físicas sem seleção. Restauração não destrutiva, múltiplos
  pais, completude lógica, proveniência operacional, receipts, retenção, manifests,
  content addressing, event sourcing, IndexedDB, banco e object storage não foram
  promovidos a decisões. Regras de audiência, atenuação e revogação foram deixadas para
  colaboração e acesso. Uma alteração terminológica colateral em SRC-000252, detectada na
  auditoria do inventário, foi restaurada ao texto verificado anterior. Nenhuma nova
  decisão de produto foi criada.

next_step: >-
  Processar somente SRC-000221, SRC-000222 e SRC-000356 a SRC-000361, camada estruturada
  de alternativas, requisitos e evidências de economia e arquitetura de histórico do
  domínio versionamento e proveniência. Confrontar versões v1 e v2 com VER-002, PROV-004,
  INF-001, DEC-005 e DEC-007, deduplicando itens superados e manifestos puramente
  estruturais. Tratar números, quotas, preços, capacidades de providers e afirmações de
  produto como evidência temporal do recorte, não como fato vigente, e não realizar nova
  pesquisa de mercado durante a consolidação. Não selecionar banco, BaaS, object storage,
  content addressing, event sourcing, Git, schema, granularidade ou política de retenção.
  Após o lote, processar separadamente o pacote de grafo derivacional e acesso, destinando
  suas regras de autorização ao domínio colaboração e acesso.