last_batch: >-
  Primeiro lote de sincronização e funcionamento offline processado em SRC-000046,
  SRC-000053 e SRC-000111. As três fontes foram consideradas relevantes. SRC-000046
  e SRC-000053 são issues do programa de implementação R1 e R3 encerradas como
  not_planned; delas foram preservados somente problemas e invariantes candidatos sobre
  materialização local recuperável, atualização sem destruir a última versão válida,
  reabertura sem conexão, pressão de armazenamento, idempotência quando necessária,
  conflitos explícitos, preservação da intenção local, revogação, retirada de publicação
  e ausência de perda silenciosa. SRC-000111 é ADR histórico accepted sem autoridade
  canônica atual. Outbox, receipts, request ID, expected revision, compare-and-set,
  reapply, fork e seleção humana foram preservados como alternativas históricas. A
  exclusão v1 de CRDT e merge semântico automático não foi promovida a proibição
  universal; permanece somente a restrição de que o corpus não autoriza merge semântico
  silencioso sem semântica e autoridade definidas. O repositório público recebeu
  docs/evidencias/sincronizacao-funcionamento-offline-2026-08.md como evidência histórica
  e não normativa e dois itens novos no backlog: SYNC-001, para materialização,
  atualização e recuperação offline, e SYNC-002, para sincronização, idempotência e
  conflitos sem perda silenciosa, ambos pending_research. A comparação pública desde o
  head anterior mostrou somente quarenta e três linhas adicionadas a BACKLOG.yaml e cento
  e setenta e oito linhas no novo documento de evidências, sem remoções. DECISOES.md não
  foi alterado. As buscas públicas não localizaram o nome do repositório de origem, a
  branch de controle, identificadores SRC-* nem o marco interno do corpus. Nenhum banco
  local, cache, formato de pacote, schema de outbox ou receipt, compare-and-set API,
  CRDT, engine de sincronização, provider, transporte, interface de conflito ou
  implementação foi selecionado. A substituição integral do inventário foi auditada com
  exatamente três adições e três remoções, somente nas três fontes previstas. Busca no
  inventário atual não encontrou outra fonte primária do domínio ainda identified.
  Nenhuma nova decisão foi criada.

next_step: >-
  Auditar somente SRC-000046, SRC-000053 e SRC-000111, as três fontes primárias do
  domínio sincronização e funcionamento offline. Confrontar cobertura, destinos e
