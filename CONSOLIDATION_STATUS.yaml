last_batch: >-
  Segundo lote de implantação e interoperabilidade processado em SRC-000408 a
  SRC-000431 e SRC-000464, correspondente à rodada executável de adapters descartáveis
  e sua síntese em português do Brasil. As vinte e cinco fontes foram consideradas
  relevantes e registradas como processed porque, em conjunto, constituem instrumento
  de pesquisa reproduzível: documentação, fixtures, demonstração de navegador,
  ambiente Node, relatórios, scripts, servidor local, núcleo do lifecycle, quatro
  adapters, código de navegador, testes e síntese. O repositório público preservou o
  instrumento em docs/evidencias/prototipos/adapters-descartaveis-01/ e criou
  docs/evidencias/adapters-descartaveis-2026-08.md como síntese histórica e não
  normativa. O README público do artefato foi reescrito em português do Brasil sem
  referências administrativas antigas. O standalone.html gerado não foi preservado
  separadamente porque scripts/build-standalone.mjs permite regenerá-lo. A comparação
  pública desde o head anterior mostrou exatamente vinte e cinco arquivos novos,
  nenhuma remoção e nenhuma alteração de arquivo preexistente. O artefato preserva
  quatro famílias: matemática semântica, construção relacional, programação executável
  e argumento com fontes, e um lifecycle experimental load, start, importResponse,
  exportResponse, validate, produceFeedback e dispose. Esse lifecycle e a fronteira
  exportResponse permanecem evidência de representabilidade, não contratos vigentes.
  Matemática separa parsing, interpretação, equivalência e forma solicitada; a
  equivalência por amostragem foi rejeitada pela própria rodada como prova geral ou
  validador produtivo. Construção relacional mantém geometria derivada fora da resposta.
  Programação separa testes públicos e protegidos, parsing, falha e timeout; Web Worker
  e Node vm foram rejeitados somente para a função situada de sandbox produtiva contra
  código hostil, sem proibição universal para outros usos. Argumento com fontes separa
  integridade determinística de digest e seletor da revisão humana de relevância e
  justificativa. O relatório Node registra seis de seis testes aprovados; o walkthrough
  Chromium registra quinze de quinze verificações aprovadas; a inspeção de
  acessibilidade registra controles nomeados, sete nós de status e seis headings. Esses
  resultados demonstram somente os ensaios executados e não constituem validação do
  produto, conformidade de acessibilidade, segurança de produção, escalabilidade ou
  efetividade educacional. As medições de tamanho, inicialização, heap e quinhentos
  ciclos por adapter descrevem o ambiente registrado sem runtimes externos; deltas de
  heap são ruidosos e não são budgets ou SLAs. Node.js 22.16.0, Python 3.13.5,
  Playwright e Chromium 144.0.7559.96 permanecem ferramentas do experimento; a versão de
  Playwright não está fixada em arquivo de dependências do pacote. As dez alterações
  contratuais propostas permanecem propostas históricas. A regra experimental
  courseSuppliedCode=forbidden não foi promovida: a governança de extensões fornecidas
  pelo conteúdo continua pendente em EXP-009. Nenhum lifecycle, schema, formato de
  resposta, runtime, biblioteca, worker, servidor, sandbox, arquitetura, stack ou
  implementação foi aprovado. BACKLOG.yaml e DECISOES.md não foram alterados. As buscas
  públicas não localizaram o nome do repositório de origem, a branch de controle,
  identificadores SRC-* nem o marco interno do corpus. A substituição integral do
  inventário foi auditada com exatamente vinte e cinco adições e vinte e cinco remoções,
  somente nas fontes previstas. Nenhuma nova decisão foi criada.

next_step: >-
  Processar somente SRC-000432 a SRC-000443, terceiro lote do domínio implantação e
  interoperabilidade, correspondente ao protótipo external-adapters-01. Ler integralmente
  README, fixtures, lockfile, package, quatro relatórios, três boundary adapters e o teste
  de fronteira. Confrontar o lote com MODEL-003, EXP-007, EXP-008, EXP-009, PED-004,
  INF-001, VAL-001, VAL-002, SCOPE-005, DEC-006, DEC-007, a síntese já verificada sobre
  contratos 0.2 e os documentos públicos de evidências sobre adapters descartáveis,
  fronteiras de execução e perfis de implantação. Separar compatibilidade do boundary
  de execução real, disponibilidade do pacote, licença, acessibilidade, desempenho e
  adequação pedagógica. MathLive, Cytoscape.js e Recogito devem permanecer bibliotecas
  externas candidatas e não selecionadas; metadados de pacote, versões, licenças,
  resultados de testes de fronteira e auditoria de fontes são evidência situada sujeita
  aos limites do corpus. Não transformar package installed/resolved, boundary passed,
  wrapper ou mapping em seleção tecnológica ou resultado validado do produto. Não
  selecionar biblioteca, versão, package manager, adapter API, lifecycle, schema,
  renderer, runtime, stack, arquitetura ou implementação. Não processar ainda
  SRC-000445, que ficará como lote final primário de implantação e interoperabilidade,
  nem SRC-000257 a SRC-000269, que pertencem ao domínio avaliação e validação.