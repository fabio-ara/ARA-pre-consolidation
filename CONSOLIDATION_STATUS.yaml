last_batch: >-
  Primeiro lote de avaliação e validação processado em SRC-000037 a SRC-000040.
  Foram preservados protocolos e resultados históricos de contratos por primeiros
  princípios, adapters descartáveis, revisão contratual 0.2 e comparação futura de
  runtimes externos, sempre separando conformidade estrutural, comportamento de
  protótipo, execução real, segurança, acessibilidade e efetividade educacional.
  As dez emendas permanecem propostas do protótipo sem autoridade canônica; MathLive,
  Cytoscape.js e Recogito não foram executados nem selecionados. A limitação ambiental
  não foi tratada como evidência contra bibliotecas. O documento público sobre adapters
  externos recebeu as condições e o método histórico para eventual revalidação futura.
  BACKLOG.yaml e DECISOES.md permaneceram inalterados; nenhuma nova decisão de produto
  foi criada. As quatro fontes foram registradas como processed e relevant=true.

